// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '1.9.20'
        compileSdkVer = 31
        minSdkVer = 18
        targetSdkVer = 31

        useLocalSource = true
    }
    repositories {
        google()
        maven{ url 'https://maven.aliyun.com/repository/jcenter'}
        maven{ url 'https://maven.aliyun.com/repository/google' }
        maven{ url 'https://maven.aliyun.com/repository/central'}
        // 内网访问地址
        maven { url "https://maven.tuya-inc.top/nexus/content/repositories/releases/" }
        maven { url "https://maven.tuya-inc.top/nexus/content/repositories/central" }
        maven { url "https://maven.tuya-inc.top/nexus/content/repositories/snapshots/" }

        flatDir {
            dirs 'app/libs',"libs"
        }

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.tuya.smart.upload:tyupload:0.3.0-vulcan-sdk-SNAPSHOT'
        classpath 'com.thingclips.smart:fat-aar:1.3.8-SNAPSHOT'
    }
}

allprojects {
    repositories {
        google()
        // 内网访问地址
        maven { url "https://maven.tuya-inc.top/nexus/content/repositories/releases/" }
        maven { url "https://maven.tuya-inc.top/nexus/content/repositories/central" }
        maven { url "https://maven.tuya-inc.top/nexus/content/repositories/snapshots/" }

        maven{ url 'https://maven.aliyun.com/repository/jcenter'}
        maven{ url 'https://maven.aliyun.com/repository/google' }
        maven{ url 'https://maven.aliyun.com/repository/central'}

        //外网访问
        maven { url 'https://maven-other.tuya.com/repository/maven-releases/' }
        maven { url "https://maven-other.tuya.com/repository/maven-commercial-releases/" }
        
        // JitPack 仓库（用于 poi-android）
        maven { url 'https://jitpack.io' }

        flatDir {
            dirs 'app/libs',"libs"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}